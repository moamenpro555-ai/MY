<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تفاصيل المنتج | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/product-details.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container pd-page">
    <ol class="breadcrumbs" id="breadcrumbs">
      <li><a href="../index.html">الرئيسية</a></li>
      <li><a href="products.html">المنتجات</a></li>
      <li aria-current="page">...</li>
    </ol>

    <div id="product-area" aria-live="polite">
      <div class="pd-layout" aria-hidden="true">
        <div class="skeleton pd-skeleton-img"></div>
        <div class="pd-skeleton-info">
          <div class="skeleton skeleton-line short"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line medium"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-btn"></div>
        </div>
      </div>
    </div>

    <section class="section pd-reviews" id="reviews-section" aria-labelledby="reviews-title" hidden>
      <div class="section-head"><h2 class="section-title" id="reviews-title">تقييمات العملاء</h2></div>
      <div class="pd-reviews-layout">
        <div class="pd-reviews-side">
          <div class="card"><div class="card-body" id="reviews-summary"></div></div>
          <div class="card"><div class="card-body" id="review-form-wrap"></div></div>
        </div>
        <div>
          <div id="reviews-list" class="pd-reviews-list" aria-live="polite"></div>
          <div id="reviews-pager" class="pagination-wrap"></div>
        </div>
      </div>
    </section>

    <section class="section" id="similar-section" aria-labelledby="similar-title" hidden>
      <div class="section-head"><h2 class="section-title" id="similar-title">منتجات مشابهة</h2></div>
      <div class="product-grid" id="similar-grid"></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/product-details.js"></script>
</body>
</html>
