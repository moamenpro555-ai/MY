<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container auth-page">
    <div class="auth-card card">
      <div class="auth-head">
        <div class="auth-head-icon" data-icon="lock"></div>
        <h1 class="auth-title">إعادة تعيين كلمة المرور</h1>
        <p class="auth-subtitle">اختر كلمة مرور جديدة لحسابك</p>
      </div>
      <div class="card-body">
        <div id="missing-token" class="alert alert-danger" role="alert" hidden>
          <div>رابط إعادة التعيين غير صالح أو ناقص. <a class="auth-link" href="forgot-password.html">اطلب رابطاً جديداً</a></div>
        </div>
        <div id="form-alert" class="alert alert-danger" role="alert" aria-live="assertive" hidden></div>
        <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور الجديدة <span class="required-mark">*</span></label>
          <div class="input-with-icon">
            <span data-icon="lock"></span>
            <input class="form-control has-toggle ltr" type="password" id="password" name="password" autocomplete="new-password" required dir="ltr">
            <button type="button" class="password-toggle" data-toggle-password="password" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
          </div>
          <div class="field-error" aria-live="polite"></div>
          <div class="form-hint">٨ أحرف على الأقل، وتحتوي على حرف ورقم.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">تأكيد كلمة المرور الجديدة <span class="required-mark">*</span></label>
          <div class="input-with-icon">
            <span data-icon="lock"></span>
            <input class="form-control has-toggle ltr" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required dir="ltr">
            <button type="button" class="password-toggle" data-toggle-password="confirmPassword" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
          </div>
          <div class="field-error" aria-live="polite"></div>
        </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">حفظ كلمة المرور</button>
        </form>
        <div id="success-box" class="auth-success" role="status" aria-live="polite" hidden>
          <div class="auth-success-icon" data-icon="check"></div>
          <p class="fw-bold">تم تغيير كلمة المرور بنجاح</p>
          <p class="text-muted text-sm">لأمانك، تم تسجيل خروجك من جميع الأجهزة. سجّل دخولك بكلمة المرور الجديدة.</p>
          <a class="btn btn-primary mt-3" href="login.html">تسجيل الدخول</a>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/reset-password.js"></script>
</body>
</html>
