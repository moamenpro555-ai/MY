<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نسيت كلمة المرور | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container auth-page">
    <div class="auth-card card">
      <div class="auth-head">
        <div class="auth-head-icon" data-icon="lock"></div>
        <h1 class="auth-title">نسيت كلمة المرور؟</h1>
        <p class="auth-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور</p>
      </div>
      <div class="card-body">
        <div id="form-alert" class="alert alert-danger" role="alert" aria-live="assertive" hidden></div>
        <form id="forgot-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">البريد الإلكتروني <span class="required-mark">*</span></label>
            <div class="input-with-icon">
              <span data-icon="mail"></span>
              <input class="form-control ltr" type="email" id="email" name="email" autocomplete="email" inputmode="email" dir="ltr" required data-autofocus>
            </div>
            <div class="field-error" aria-live="polite"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">إرسال رابط إعادة التعيين</button>
        </form>
        <div id="success-box" class="auth-success" role="status" aria-live="polite" hidden>
          <div class="auth-success-icon" data-icon="check"></div>
          <p id="success-msg" class="fw-bold"></p>
          <p class="text-muted text-sm">تحقق من صندوق الوارد والرسائل غير المرغوب فيها. صلاحية الرابط ساعة واحدة.</p>
        </div>
        <p class="auth-switch"><a href="login.html">العودة لتسجيل الدخول</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/forgot-password.js"></script>
</body>
</html>
