<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الطلبات | لوحة التحكم | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin/common.css">
  <link rel="stylesheet" href="../css/admin/orders.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <p class="admin-sidebar-title">لوحة التحكم</p>
        <nav class="admin-nav" aria-label="لوحة التحكم">
          <a href="index.html" data-nav="dashboard">لوحة المعلومات</a>
          <a href="products.html" data-nav="products">المنتجات</a>
          <a href="orders.html" data-nav="orders" class="is-active" aria-current="page">الطلبات</a>
          <a href="customers.html" data-nav="customers">العملاء</a>
          <a href="categories.html" data-nav="categories">الأقسام</a>
          <a href="coupons.html" data-nav="coupons">الكوبونات</a>
          <a href="reports.html" data-nav="reports">التقارير</a>
        </nav>
      </aside>
      <section class="admin-content">

        <div class="admin-page-head"><h1>الطلبات</h1></div>
        <div class="toolbar" role="search">
          <label class="sr-only" for="search-input">بحث</label>
          <input class="form-control toolbar-search" id="search-input" type="search" placeholder="رقم الطلب أو اسم العميل…" autocomplete="off">
          <label class="sr-only" for="status-filter">الحالة</label>
          <select class="form-select" id="status-filter"><option value="">كل الحالات</option><option value="PENDING">قيد الانتظار</option><option value="CONFIRMED">تم التأكيد</option><option value="PROCESSING">قيد التجهيز</option><option value="SHIPPED">تم الشحن</option><option value="DELIVERED">تم التسليم</option><option value="CANCELLED">ملغي</option></select>
        </div>
        <div class="table-wrap"><table class="data-table"><caption class="sr-only">قائمة الطلبات</caption>
          <thead><tr><th scope="col">رقم الطلب</th><th scope="col">العميل</th><th scope="col">التاريخ</th><th scope="col">الحالة</th><th scope="col">الدفع</th><th scope="col" class="col-num">الإجمالي</th><th scope="col" class="col-actions">إجراءات</th></tr></thead>
          <tbody id="table-body"></tbody></table></div>
        <div id="pager" class="pagination-wrap"></div>
      </section>
    </div>
  </main>
  <div class="modal-backdrop" id="order-modal" hidden>
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="order-modal-title">
      <div class="modal-header"><h2 class="modal-title" id="order-modal-title">تفاصيل الطلب</h2>
        <button type="button" class="icon-btn modal-close" data-close-modal aria-label="إغلاق"></button></div>
      <div class="modal-body" id="order-detail"></div>
      <div class="modal-footer"><form class="order-status-form" id="status-form" novalidate hidden>
          <label class="form-label" for="status-select">تغيير الحالة</label>
          <select class="form-select" id="status-select" name="status"></select>
          <button class="btn btn-primary" type="submit" id="status-save">تحديث الحالة</button></form>
        <button class="btn btn-outline" type="button" data-close-modal>إغلاق</button></div>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin/common.js"></script>
  <script src="../js/admin/orders.js"></script>
</body>
</html>
