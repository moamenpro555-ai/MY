<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الكوبونات | لوحة التحكم | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin/common.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <p class="admin-sidebar-title">لوحة التحكم</p>
        <nav class="admin-nav" aria-label="لوحة التحكم">
          <a href="index.html" data-nav="dashboard">لوحة المعلومات</a>
          <a href="products.html" data-nav="products">المنتجات</a>
          <a href="orders.html" data-nav="orders">الطلبات</a>
          <a href="customers.html" data-nav="customers">العملاء</a>
          <a href="categories.html" data-nav="categories">الأقسام</a>
          <a href="coupons.html" data-nav="coupons" class="is-active" aria-current="page">الكوبونات</a>
          <a href="reports.html" data-nav="reports">التقارير</a>
        </nav>
      </aside>
      <section class="admin-content">

        <div class="admin-page-head"><h1>الكوبونات</h1>
          <button type="button" class="btn btn-primary" id="add-btn">إضافة كوبون</button></div>
        <div class="table-wrap"><table class="data-table"><caption class="sr-only">قائمة الكوبونات</caption>
          <thead><tr><th scope="col">الكود</th><th scope="col">الخصم</th><th scope="col" class="col-num">حد أدنى</th><th scope="col" class="col-num">أقصى خصم</th><th scope="col" class="col-num">الاستخدام</th><th scope="col" class="col-num">لكل عميل</th><th scope="col">الفترة</th><th scope="col">الحالة</th><th scope="col" class="col-actions">إجراءات</th></tr></thead>
          <tbody id="table-body"></tbody></table></div>
      </section>
    </div>
  </main>
  <div class="modal-backdrop" id="coupon-modal" hidden>
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="coupon-modal-title">
      <div class="modal-header"><h2 class="modal-title" id="coupon-modal-title">كوبون</h2>
        <button type="button" class="icon-btn modal-close" data-close-modal aria-label="إغلاق"></button></div>
      <form id="coupon-form" novalidate>
      <div class="modal-body"><div class="form-grid">
        <div class="form-group"><label class="form-label" for="f-code">الكود <span class="required-mark">*</span></label><input class="form-control ltr" id="f-code" name="code" type="text" required maxlength="40" autocomplete="off" data-autofocus><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-discountType">نوع الخصم <span class="required-mark">*</span></label><select class="form-select" id="f-discountType" name="discountType"><option value="PERCENTAGE">نسبة مئوية (%)</option><option value="FIXED">مبلغ ثابت (ج.م)</option></select><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-discountValue">قيمة الخصم <span class="required-mark">*</span></label><input class="form-control" id="f-discountValue" name="discountValue" type="number" min="0" step="0.01" required inputmode="decimal"><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-minOrderTotal">الحد الأدنى للطلب</label><input class="form-control" id="f-minOrderTotal" name="minOrderTotal" type="number" min="0" step="0.01" inputmode="decimal"><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-maxDiscount">أقصى قيمة خصم</label><input class="form-control" id="f-maxDiscount" name="maxDiscount" type="number" min="0" step="0.01" inputmode="decimal"><div class="field-error"></div><div class="form-hint">للنسبة المئوية فقط.</div></div>
        <div class="form-group"><label class="form-label" for="f-usageLimit">إجمالي مرات الاستخدام</label><input class="form-control" id="f-usageLimit" name="usageLimit" type="number" min="1" step="1" inputmode="numeric"><div class="field-error"></div><div class="form-hint">فارغ = غير محدود.</div></div>
        <div class="form-group"><label class="form-label" for="f-perUserLimit">الحد لكل عميل</label><input class="form-control" id="f-perUserLimit" name="perUserLimit" type="number" min="1" step="1" inputmode="numeric"><div class="field-error"></div></div>
        <div class="form-group"><span class="form-label">&nbsp;</span><label class="form-check"><input type="checkbox" id="f-isActive" name="isActive" checked><span class="form-check-label">الكوبون نشط</span></label></div>
        <div class="form-group"><label class="form-label" for="f-startsAt">يبدأ في</label><input class="form-control" id="f-startsAt" name="startsAt" type="datetime-local" ><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-expiresAt">ينتهي في</label><input class="form-control" id="f-expiresAt" name="expiresAt" type="datetime-local" ><div class="field-error"></div></div>
        <div class="form-group full"><label class="form-label" for="f-description">الوصف</label><textarea class="form-control" id="f-description" name="description" rows="2"></textarea><div class="field-error"></div></div>
      </div></div>
      <div class="modal-footer"><button class="btn btn-primary" type="submit" id="save-btn">حفظ</button>
          <button class="btn btn-outline" type="button" data-close-modal>إلغاء</button></div>
      </form>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin/common.js"></script>
  <script src="../js/admin/coupons.js"></script>
</body>
</html>
