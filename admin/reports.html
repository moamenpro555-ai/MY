<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>التقارير | لوحة التحكم | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin/common.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <p class="admin-sidebar-title">لوحة التحكم</p>
        <nav class="admin-nav" aria-label="لوحة التحكم">
          <a href="index.html" data-nav="dashboard">لوحة المعلومات</a>
          <a href="products.html" data-nav="products">المنتجات</a>
          <a href="orders.html" data-nav="orders">الطلبات</a>
          <a href="customers.html" data-nav="customers">العملاء</a>
          <a href="categories.html" data-nav="categories">الأقسام</a>
          <a href="coupons.html" data-nav="coupons">الكوبونات</a>
          <a href="reports.html" data-nav="reports" class="is-active" aria-current="page">التقارير</a>
        </nav>
      </aside>
      <section class="admin-content">

        <div class="admin-page-head"><h1>تقارير المبيعات</h1>
          <button type="button" class="btn btn-outline" id="export-btn" disabled>تصدير CSV</button></div>
        <form class="toolbar" id="report-form" novalidate>
          <div class="form-group mb-0"><label class="form-label" for="from">من</label><input class="form-control" type="date" id="from" name="from" required></div>
          <div class="form-group mb-0"><label class="form-label" for="to">إلى</label><input class="form-control" type="date" id="to" name="to" required></div>
          <div class="form-group mb-0"><label class="form-label" for="groupBy">التجميع</label>
            <select class="form-select" id="groupBy" name="groupBy"><option value="day">يومي</option><option value="month">شهري</option></select></div>
          <button type="submit" class="btn btn-primary" id="run-btn">عرض التقرير</button>
        </form>
        <div id="report-error" class="alert alert-danger" hidden></div>
        <div class="stat-grid" id="totals" aria-live="polite"></div>
        <div class="card admin-section"><div class="card-header"><h2 class="admin-card-title">الإيراد حسب الفترة</h2></div><div class="card-body" id="report-chart"></div></div>
        <div class="table-wrap"><table class="data-table"><caption class="sr-only">تفاصيل المبيعات</caption>
          <thead><tr><th scope="col">الفترة</th><th scope="col" class="col-num">عدد الطلبات</th><th scope="col" class="col-num">الإيراد</th></tr></thead>
          <tbody id="table-body"></tbody></table></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin/common.js"></script>
  <script src="../js/admin/reports.js"></script>
</body>
</html>
