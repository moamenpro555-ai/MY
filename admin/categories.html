<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الأقسام | لوحة التحكم | سوق بلس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin/common.css">
</head>
<body data-root="../">
  <div id="site-header"></div>
  <main id="main" class="container">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <p class="admin-sidebar-title">لوحة التحكم</p>
        <nav class="admin-nav" aria-label="لوحة التحكم">
          <a href="index.html" data-nav="dashboard">لوحة المعلومات</a>
          <a href="products.html" data-nav="products">المنتجات</a>
          <a href="orders.html" data-nav="orders">الطلبات</a>
          <a href="customers.html" data-nav="customers">العملاء</a>
          <a href="categories.html" data-nav="categories" class="is-active" aria-current="page">الأقسام</a>
          <a href="coupons.html" data-nav="coupons">الكوبونات</a>
          <a href="reports.html" data-nav="reports">التقارير</a>
        </nav>
      </aside>
      <section class="admin-content">

        <div class="admin-page-head"><h1>الأقسام</h1>
          <button type="button" class="btn btn-primary" id="add-btn">إضافة قسم</button></div>
        <div class="table-wrap"><table class="data-table"><caption class="sr-only">قائمة الأقسام</caption>
          <thead><tr><th scope="col">القسم</th><th scope="col">الرابط (slug)</th><th scope="col">القسم الأب</th><th scope="col" class="col-num">المنتجات</th><th scope="col" class="col-num">الترتيب</th><th scope="col">الحالة</th><th scope="col" class="col-actions">إجراءات</th></tr></thead>
          <tbody id="table-body"></tbody></table></div>
      </section>
    </div>
  </main>
  <div class="modal-backdrop" id="category-modal" hidden>
    <div class="modal " role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
      <div class="modal-header"><h2 class="modal-title" id="category-modal-title">قسم</h2>
        <button type="button" class="icon-btn modal-close" data-close-modal aria-label="إغلاق"></button></div>
      <form id="category-form" novalidate>
      <div class="modal-body"><div class="form-grid">
        <div class="form-group full"><label class="form-label" for="f-name">الاسم <span class="required-mark">*</span></label><input class="form-control" id="f-name" name="name" type="text" required maxlength="120" data-autofocus><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-slug">الرابط (slug)</label><input class="form-control ltr" id="f-slug" name="slug" type="text" dir="ltr" maxlength="150"><div class="field-error"></div><div class="form-hint">اختياري — يُولَّد تلقائياً.</div></div>
        <div class="form-group"><label class="form-label" for="f-parentId">القسم الأب</label><select class="form-select" id="f-parentId" name="parentId"><option value="">بدون</option></select><div class="field-error"></div></div>
        <div class="form-group full"><label class="form-label" for="f-description">الوصف</label><textarea class="form-control" id="f-description" name="description" rows="3"></textarea><div class="field-error"></div></div>
        <div class="form-group full"><label class="form-label" for="f-imageUrl">رابط الصورة</label><input class="form-control ltr" id="f-imageUrl" name="imageUrl" type="url" dir="ltr" placeholder="https://…"><div class="field-error"></div></div>
        <div class="form-group"><label class="form-label" for="f-sortOrder">الترتيب</label><input class="form-control" id="f-sortOrder" name="sortOrder" type="number" min="0" step="1" value="0" inputmode="numeric"><div class="field-error"></div></div>
        <div class="form-group"><span class="form-label">&nbsp;</span><label class="form-check"><input type="checkbox" id="f-isActive" name="isActive" checked><span class="form-check-label">القسم نشط</span></label></div>
      </div></div>
      <div class="modal-footer"><button class="btn btn-primary" type="submit" id="save-btn">حفظ</button>
          <button class="btn btn-outline" type="button" data-close-modal>إلغاء</button></div>
      </form>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin/common.js"></script>
  <script src="../js/admin/categories.js"></script>
</body>
</html>
